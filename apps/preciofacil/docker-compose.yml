services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - preciofacil-db:/app/data
    environment:
      - TZ=Europe/Madrid
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  preciofacil-db:
