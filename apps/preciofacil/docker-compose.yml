services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - preciofacil-db:/app/data
      - preciofacil-media:/app/media
    environment:
      - TZ=Europe/Madrid
      - PRECIOFACIL_DB_PATH=/app/data/preciofacil.db
      # Necesaria para el análisis de tickets con Claude Vision (opcional:
      # sin ella, ese endpoint devuelve un 503 y el resto de la app sigue
      # funcionando). Defínela en tu shell o en un .env junto a este archivo.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Necesarias para las notificaciones push de alertas de precio
      # (opcional: sin ellas, ese botón de Ajustes avisa de que no está
      # activado y el resto de la app sigue funcionando). Genéralas con
      # `python -m scripts.generate_vapid_keys` dentro de backend/.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-mailto:preciofacil@example.com}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  preciofacil-db:
  preciofacil-media:
